<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Lebenslauf QR – Zidane Kenfack Fouape</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='42' font-family='system-ui,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'>ZK</text></svg>">
  <link rel="apple-touch-icon" href="assets/img/qr-lebenslauf.png">
  <style>
    /* Immer hell: maximaler Kontrast zum Scannen, auch im Dark Mode des Handys */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #ffffff; color: #0f172a;
      font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(1.3rem, 1rem + 2vw, 2rem); font-weight: 800; letter-spacing: -.02em; }
    .role { margin: 2px 0 0; color: #1d4ed8; font-weight: 650; font-size: clamp(.95rem, .85rem + .6vw, 1.15rem); }
    .qr {
      width: min(88vw, 62vh, 560px); aspect-ratio: 1;
      padding: 10px; border: 3px solid #1d4ed8; border-radius: 22px; background: #fff;
    }
    .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .hint { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .hint span { display: block; font-weight: 400; color: #475569; font-size: .9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px;
      font-weight: 650; text-decoration: none; border: 2px solid #1d4ed8; color: #1d4ed8; background: #fff;
    }
    .btn.primary { background: #1d4ed8; color: #fff; }
    .btn:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 3px; }
    .url { font-size: .8rem; color: #64748b; word-break: break-all; margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Zidane Kenfack Fouape</h1>
    <p class="role">Full-Stack Software Developer &amp; AI Engineer</p>
  </header>

  <div class="qr">
    <img src="assets/img/qr-lebenslauf.svg" alt="QR-Code zum Lebenslauf von Zidane Kenfack Fouape (PDF)">
  </div>

  <p class="hint">Mit der Handykamera scannen, um meinen Lebenslauf zu öffnen
    <span>Scan with your phone camera to open my CV</span></p>

  <div class="actions">
    <a class="btn primary" href="assets/cv/Lebenslauf_Zidane_Kenfack_Fouape.pdf" target="_blank" rel="noopener">Lebenslauf öffnen</a>
    <a class="btn" href="./">Zum Portfolio</a>
  </div>
  <p class="url">danezi.github.io</p>

  <script>
    // Bildschirm anlassen, solange der QR-Code gezeigt wird (falls vom Browser unterstützt)
    (function () {
      var lock = null;
      function request() {
        try {
          if ("wakeLock" in navigator && document.visibilityState === "visible") {
            navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
          }
        } catch (e) {}
      }
      request();
      document.addEventListener("visibilitychange", request);
    })();
  </script>
</body>
</html>
