<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration: Schiff, LKW und Zug in einer gekoppelten Simulation">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- water -->
  <rect x="0" y="300" width="800" height="150" fill="#0369a1" opacity=".35"/>
  <path d="M0 320q25-10 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/>
  <!-- ship -->
  <g transform="translate(90 245)">
    <path d="M0 50h260l-30 40H25z" fill="#2563eb"/>
    <g><rect x="30" y="20" width="40" height="30" fill="#38bdf8"/><rect x="72" y="20" width="40" height="30" fill="#facc15"/><rect x="114" y="20" width="40" height="30" fill="#93c5fd"/><rect x="72" y="-12" width="40" height="30" fill="#38bdf8"/><rect x="114" y="-12" width="40" height="30" fill="#2563eb"/></g>
    <rect x="190" y="-10" width="30" height="60" fill="#e0f2fe"/>
  </g>
  <!-- quay / road -->
  <rect x="380" y="270" width="420" height="30" fill="#1e293b"/>
  <path d="M400 285h380" stroke="#facc15" stroke-width="3" stroke-dasharray="18 14"/>
  <!-- truck -->
  <g transform="translate(470 220)"><rect x="0" y="0" width="110" height="45" rx="4" fill="#38bdf8"/><path d="M112 12h28l18 18v15h-46z" fill="#93c5fd"/><circle cx="25" cy="50" r="10" fill="#0f172a" stroke="#e0f2fe" stroke-width="3"/><circle cx="135" cy="50" r="10" fill="#0f172a" stroke="#e0f2fe" stroke-width="3"/></g>
  <!-- rail + train -->
  <path d="M380 200h420" stroke="#64748b" stroke-width="4"/>
  <g transform="translate(560 150)"><rect x="0" y="0" width="80" height="42" rx="6" fill="#2563eb"/><rect x="86" y="0" width="80" height="42" rx="6" fill="#2563eb"/><rect x="10" y="10" width="20" height="14" fill="#bfdbfe"/><rect x="40" y="10" width="20" height="14" fill="#bfdbfe"/><rect x="96" y="10" width="20" height="14" fill="#bfdbfe"/><rect x="126" y="10" width="20" height="14" fill="#bfdbfe"/></g>
  <!-- sync clock -->
  <g transform="translate(150 110)"><circle r="44" fill="#0f2547" stroke="#38bdf8" stroke-width="4"/><path d="M0 -26V0l18 12" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" fill="none"/></g>
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round"><path d="M195 110C300 110 380 150 470 225"/><path d="M195 100C320 90 480 100 560 160"/></g>
</svg>
