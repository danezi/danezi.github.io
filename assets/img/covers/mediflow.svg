<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration: Dashboard mit ROC-Kurve und Chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#0f3b6e"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- dashboard panel -->
  <rect x="60" y="55" width="430" height="340" rx="16" fill="#0f2547" stroke="#3b82f6" stroke-opacity=".45"/>
  <rect x="85" y="80" width="120" height="12" rx="6" fill="#93c5fd" opacity=".7"/>
  <!-- ROC axes -->
  <g transform="translate(110 360)">
    <line x1="0" y1="0" x2="340" y2="0" stroke="#64748b"/><line x1="0" y1="0" x2="0" y2="-240" stroke="#64748b"/>
    <line x1="0" y1="0" x2="340" y2="-240" stroke="#64748b" stroke-dasharray="6 6"/>
    <path d="M0 0 C 10 -180, 60 -225, 340 -240 L340 0 Z" fill="url(#area)"/>
    <path d="M0 0 C 10 -180, 60 -225, 340 -240" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>
  <text x="330" y="300" fill="#e0f2fe" font-family="system-ui,sans-serif" font-size="26" font-weight="700">AUC 0,957</text>
  <!-- chat bubbles -->
  <g font-family="system-ui,sans-serif">
    <rect x="530" y="80" width="210" height="58" rx="16" fill="#1e40af"/>
    <rect x="550" y="100" width="150" height="8" rx="4" fill="#bfdbfe"/><rect x="550" y="116" width="100" height="8" rx="4" fill="#bfdbfe" opacity=".7"/>
    <rect x="560" y="160" width="180" height="90" rx="16" fill="#0f2547" stroke="#3b82f6" stroke-opacity=".45"/>
    <text x="578" y="192" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="15">SELECT …</text>
    <rect x="578" y="208" width="140" height="8" rx="4" fill="#64748b"/><rect x="578" y="224" width="100" height="8" rx="4" fill="#64748b"/>
    <rect x="530" y="272" width="210" height="58" rx="16" fill="#1e40af"/>
    <rect x="550" y="292" width="160" height="8" rx="4" fill="#bfdbfe"/><rect x="550" y="308" width="80" height="8" rx="4" fill="#bfdbfe" opacity=".7"/>
  </g>
  <!-- medical cross -->
  <g transform="translate(700 375)"><rect x="-10" y="-28" width="20" height="56" rx="4" fill="#38bdf8"/><rect x="-28" y="-10" width="56" height="20" rx="4" fill="#38bdf8"/></g>
</svg>
